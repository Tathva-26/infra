name: tathva-26

# One VM: shared Postgres + both backends on one network. App repos only build images.

services:
  db:
    image: postgres:16-alpine
    container_name: tathva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tathva}
    volumes:
      - tathva_db:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro # seeds hackathon DB on first init only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-tathva}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend-v2:
    image: ghcr.io/tathva-26/tathva-backend-26:admin-panel
    container_name: tathva-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000" # loopback only; nginx terminates TLS
    depends_on:
      db:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - backend-v2.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-tathva}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  hackathon-backend:
    image: ghcr.io/tathva-26/tathva-26-hackathon-backend:latest
    container_name: hackathon-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080" # loopback only; nginx terminates TLS
    depends_on:
      db:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - hackathon.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/hackathon?schema=public
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    healthcheck:
      # No curl/wget in node:22-slim; use Node's fetch instead.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  tathva_db:
    name: tathva-26_tathva_db
