# Prometheus: scrape only.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    env: production

scrape_configs:
  # Application metrics.
  # If METRICS_TOKEN is set in .env, add:
  #   authorization: { type: Bearer, credentials: "<same METRICS_TOKEN>" }
  - job_name: backend-v2
    metrics_path: /metrics
    static_configs:
      - targets: ["backend-v2:8000"]
        labels: { service: backend-v2 }

  # Synthetic health check via blackbox exporter.
  - job_name: blackbox-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://backend-v2:8000/healthz"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        regex: "http://([^:]+):\\d+/(.+)"
        replacement: "${1}/${2}"
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Infrastructure exporters.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
